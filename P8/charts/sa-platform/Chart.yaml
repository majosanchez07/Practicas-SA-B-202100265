apiVersion: v2
name: sa-platform
description: Plataforma de microservicios de biblioteca para la Practica 8 de Software Avanzado (GitOps con ArgoCD y entrega progresiva con Argo Rollouts)
type: application

# version    -> version del chart; se incrementa ante cualquier cambio del empaquetado.
# appVersion -> version de la aplicacion desplegada.
#
# En la Practica 8 el appVersion NO se edita a mano: el pipeline lo deriva del
# tag de Git (v1.0.0 -> 1.0.0) y lo escribe en el repositorio de manifiestos
# mediante un Pull Request automatico. ArgoCD sincroniza ese cambio y Argo
# Rollouts ejecuta la promocion progresiva. Queda prohibido el uso de latest.
version: 0.3.0
appVersion: "1.0.0"

# El linter de Helm recomienda declarar un icono para el chart.
icon: https://helm.sh/img/helm.svg

keywords:
  - microservicios
  - gitops
  - argo-rollouts
  - canary
  - helm
  - kubernetes
  - biblioteca

maintainers:
  - name: Maria Jose Tebalan Sanchez
    email: 202100265@ingenieria.usac.edu.gt

dependencies:
  # Base de datos: el chart de Bitnami la despliega como StatefulSet con su
  # PersistentVolumeClaim y su headless service, tal como exige el enunciado.
  - name: postgresql
    version: 15.5.38
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

  # Broker de mensajeria para el flujo asincrono.
  - name: rabbitmq
    version: 16.0.14
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
