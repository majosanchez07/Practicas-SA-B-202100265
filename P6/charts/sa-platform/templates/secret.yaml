{{- /*
Secret con las credenciales de la base de datos, del broker y de la aplicacion.

Ningun valor esta escrito en el repositorio: todos provienen de values que se
informan al instalar. Los helpers databaseUrl y rabbitmqUrl usan "required", de
modo que si falta una credencial la instalacion se detiene con un mensaje claro
en lugar de desplegar pods que entrarian en CrashLoopBackOff.

Los Deployments lo consumen con envFrom, tal como pide el enunciado.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.secretName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Cadenas de conexion completas, construidas por los named templates.
  DATABASE_URL: {{ include "sa-platform.databaseUrl" . | quote }}
  RABBITMQ_URL: {{ include "sa-platform.rabbitmqUrl" . | quote }}

  # Credenciales por separado, utiles para los cronjobs y para depurar.
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.auth.password | quote }}

  # Secretos propios de la aplicacion.
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey es obligatorio (generar con: openssl rand -hex 32)" .Values.secrets.jwtSecretKey | quote }}
  AES_SECRET_KEY: {{ required "secrets.aesSecretKey es obligatorio y debe medir 32 caracteres (generar con: openssl rand -hex 16)" .Values.secrets.aesSecretKey | quote }}
