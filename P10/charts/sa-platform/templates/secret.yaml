{{- /*
================================================================================
Secret con las credenciales de la base de datos, del broker y de la aplicacion.

PRACTICA 8: DESACTIVADO POR DEFECTO.
------------------------------------
Esta plantilla genera el Secret a partir de values. Eso funcionaba en las
practicas 5 a 7, donde los values se informaban al instalar desde la maquina
del estudiante y nunca llegaban a un repositorio.

En la Practica 8 el operador de despliegue lee los values desde un repositorio
PUBLICO. Si esta plantilla siguiera activa, las credenciales tendrian que estar
escritas ahi en texto claro, que es exactamente lo que el enunciado prohibe:

  "Gestion de secretos: no se admite ningun secreto en texto plano en el
   repositorio de manifiestos."

Como se resuelve en la Practica 8
---------------------------------
Las credenciales se generan en la maquina del estudiante, se cifran con la
clave publica del controlador de secretos del cluster y solo entonces se
publican, ya cifradas. El objeto cifrado puede vivir en un repositorio publico
sin riesgo: unicamente ese controlador puede descifrarlo, con una clave privada
que jamas sale del cluster.

El controlador descifra y crea un Secret ordinario con el mismo nombre que
espera esta plantilla, de modo que las cargas de trabajo lo consumen igual y no
hace falta cambiar nada mas.

Poner secretsFromValues.enabled en true reactiva esta plantilla; util para
instalar el chart fuera del flujo declarativo (por ejemplo en un entorno local
de pruebas), donde los values no se publican en ningun sitio.
================================================================================

Ningun valor esta escrito en el repositorio: todos provienen de values que se
informan al instalar. Los helpers databaseUrl y rabbitmqUrl usan "required", de
modo que si falta una credencial la instalacion se detiene con un mensaje claro
en lugar de desplegar pods que entrarian en CrashLoopBackOff.

Los Deployments lo consumen con envFrom, tal como pide el enunciado.
*/ -}}
{{- if .Values.secretsFromValues.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.secretName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Cadenas de conexion completas, construidas por los named templates.
  DATABASE_URL: {{ include "sa-platform.databaseUrl" . | quote }}
  RABBITMQ_URL: {{ include "sa-platform.rabbitmqUrl" . | quote }}

  # Credenciales por separado, utiles para los cronjobs y para depurar.
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.auth.password | quote }}

  # Secretos propios de la aplicacion.
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey es obligatorio (generar con: openssl rand -hex 32)" .Values.secrets.jwtSecretKey | quote }}
  AES_SECRET_KEY: {{ required "secrets.aesSecretKey es obligatorio y debe medir 32 caracteres (generar con: openssl rand -hex 16)" .Values.secrets.aesSecretKey | quote }}
{{- end }}
