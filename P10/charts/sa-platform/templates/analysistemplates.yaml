{{- /*
================================================================================
AnalysisTemplate — el canary decidido por metricas reales

Practica 10 — Maria Jose Tebalan Sanchez — 202100265

Que cambio respecto de la Practica 8
------------------------------------
En la P8 el analisis ejecutaba Jobs con pruebas sinteticas (curl y k6) que yo
misma habia escrito. La version candidata se aprobaba si superaba MIS pruebas,
no si se comportaba bien con el trafico que de verdad recibia. El argumento
entonces fue que sin trafico real un analisis pasivo "aprobaria por ausencia de
datos". Esta version resuelve ese argumento en lugar de esquivarlo:

  1. Las metricas vienen del trafico real que atraviesa el gateway (usuarios y
     el generador de trafico permanente del namespace).
  2. Se filtran por rollout_hash = hash del ReplicaSet candidato. El analisis
     mide SOLO la version nueva; el promedio con la estable diluiria un fallo
     del canary en un 20% del trafico hasta hacerlo invisible.
  3. La ausencia de datos NO aprueba: si la consulta devuelve un vector vacio
     o NaN, la condicion de exito es falsa y la medicion cuenta como fallo.

No queda ningun Job: el analisis consulta Prometheus y nada mas.

Las dos consultas que deciden la promocion
------------------------------------------
  tasa-de-error  fraccion de respuestas 5xx de la candidata, ventana de 1 min
                 exito si  < umbral-error (1% por defecto)
  latencia-p95   percentil 95 de la candidata, ventana de 1 min
                 exito si  < umbral-p95 (0.5 s por defecto)

Por que esos umbrales y no otros
--------------------------------
  1% de error   El SLO de disponibilidad es 99.5%: un canary con 1% de error
                consumiria el presupuesto del mes al doble de la velocidad
                permitida. Promover algo asi es gastar presupuesto a sabiendas.
  p95 < 500 ms  El SLO de latencia exige 300 ms en el p95 de las peticiones de
                usuario. El canary tolera algo mas (500 ms) porque mide una
                ventana de un minuto con pocas muestras, donde un solo pico
                pesa mucho; una regresion real (segundos, no decenas de ms) lo
                rebasa con holgura.
  failureLimit 1  dos mediciones fallidas abortan. Con una sola, un pico de un
                minuto -un pod recien arrancado calentando su JIT- revertiria
                versiones sanas.
  initialDelay 60s  el SDK exporta cada 10 s y Prometheus recolecta cada 15 s:
                antes de un minuto la ventana de rate() aun no tiene muestras
                suficientes de la candidata.
================================================================================
*/ -}}
{{- $root := . -}}
{{- $obs := .Values.observability | default dict -}}
{{- range $svc, $cfg := .Values.services }}
{{- if and $cfg.enabled $cfg.progressive $cfg.progressive.enabled }}
{{- $nombre := include "sa-platform.serviceName" (dict "root" $root "svc" $svc) }}
{{- $umbrales := $cfg.progressive.thresholds | default $root.Values.progressiveDefaults.thresholds }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $nombre }}-analisis-metricas
  namespace: {{ $root.Values.namespace.name }}
  labels:
    {{- include "sa-platform.serviceLabels" (dict "root" $root "svc" $svc) | nindent 4 }}
spec:
  args:
    - name: servicio
      value: {{ $svc | quote }}
    # Lo entrega el Rollout con valueFrom.podTemplateHashValue: Latest.
    - name: canary-hash
    - name: umbral-error
      value: {{ $umbrales.tasaErrorMaxima | default 0.01 | quote }}
    - name: umbral-p95
      value: {{ $umbrales.latenciaP95Segundos | default 0.5 | quote }}

  metrics:
    - name: tasa-de-error
      initialDelay: {{ $umbrales.retrasoInicial | default "60s" }}
      interval: {{ $umbrales.intervalo | default "30s" }}
      failureLimit: 1
      consecutiveErrorLimit: 2
      successCondition: "len(result) > 0 && !isNaN(result[0]) && result[0] < {{ "{{" }}args.umbral-error{{ "}}" }}"
      provider:
        prometheus:
          address: {{ $obs.prometheusAddress | default "http://monitoreo-prometheus.observabilidad.svc.cluster.local:9090" | quote }}
          query: |
            (
              sum(rate(sa_http_requests_total{service_name="{{ "{{" }}args.servicio{{ "}}" }}",rollout_hash="{{ "{{" }}args.canary-hash{{ "}}" }}",status_code=~"5.."}[1m]))
              or vector(0)
            )
            /
            sum(rate(sa_http_requests_total{service_name="{{ "{{" }}args.servicio{{ "}}" }}",rollout_hash="{{ "{{" }}args.canary-hash{{ "}}" }}"}[1m]))

    - name: latencia-p95
      initialDelay: {{ $umbrales.retrasoInicial | default "60s" }}
      interval: {{ $umbrales.intervalo | default "30s" }}
      failureLimit: 1
      consecutiveErrorLimit: 2
      successCondition: "len(result) > 0 && !isNaN(result[0]) && result[0] < {{ "{{" }}args.umbral-p95{{ "}}" }}"
      provider:
        prometheus:
          address: {{ $obs.prometheusAddress | default "http://monitoreo-prometheus.observabilidad.svc.cluster.local:9090" | quote }}
          query: |
            histogram_quantile(0.95,
              sum by (le) (
                rate(sa_http_request_duration_seconds_bucket{service_name="{{ "{{" }}args.servicio{{ "}}" }}",rollout_hash="{{ "{{" }}args.canary-hash{{ "}}" }}"}[1m])
              )
            )
{{- end }}
{{- end }}
